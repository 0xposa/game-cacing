<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Cacing Sederhana</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      touch-action: manipulation;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      gap: 12px;
    }

    h1 {
      font-size: 1.5rem;
      color: #4ade80;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      border: 1px solid #334155;
    }

    .score-item span {
      font-weight: bold;
      color: #38bdf8;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #020617;
      border-radius: 16px;
      border: 2px solid #334155;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 1.6rem;
      color: #ef4444;
    }

    .overlay p {
      font-size: 1rem;
      color: #94a3b8;
    }

    .btn {
      background: #22c55e;
      color: #0f172a;
      border: none;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
      background: #16a34a;
    }

    /* Kontrol D-Pad untuk Layar Sentuh / HP */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      margin-top: 4px;
    }

    .ctrl-row {
      display: flex;
      gap: 12px;
    }

    .ctrl-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      width: 58px;
      height: 52px;
      border-radius: 12px;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.1s;
    }

    .ctrl-btn:active {
      background: #334155;
      transform: scale(0.92);
      border-color: #38bdf8;
    }

    .hint {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🐍 Game Cacing</h1>

    <div class="score-board">
      <div class="score-item">Skor: <span id="currentScore">0</span></div>
      <div class="score-item">Tertinggi: <span id="highScore">0</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div id="overlay" class="overlay active">
        <h2 id="overlayTitle">Mulai Main</h2>
        <p id="overlaySub">Gunakan tombol arah / D-pad</p>
        <button id="startBtn" class="btn">Mulai</button>
      </div>
    </div>

    <!-- Tombol Kontrol Layar Sentuh -->
    <div class="controls">
      <button class="ctrl-btn" id="btnUp">▲</button>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="btnLeft">◀</button>
        <button class="ctrl-btn" id="btnDown">▼</button>
        <button class="ctrl-btn" id="btnRight">▶</button>
      </div>
    </div>

    <div class="hint">Keyboard: Panah / WASD | Swipe di layar kanvas</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    // Konfigurasi Grid
    const GRID_SIZE = 20; 
    const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20 sel

    // State Game
    let snake = [];
    let velocity = { x: 0, y: 0 };
    let nextVelocity = { x: 0, y: 0 };
    let food = { x: 5, y: 5 };
    let score = 0;
    let highScore = localStorage.getItem('cacing_highscore') || 0;
    highScoreEl.textContent = highScore;

    let gameInterval = null;
    let isRunning = false;
    const GAME_SPEED = 110; // milidetik per frame

    // Web Audio Sound FX sederhana (tanpa aset eksternal)
    let audioCtx = null;
    function playBeep(freq, duration, type = 'sine') {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      velocity = { x: 1, y: 0 };
      nextVelocity = { x: 1, y: 0 };
      score = 0;
      currentScoreEl.textContent = score;
      spawnFood();
      render();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function setDirection(x, y) {
      if (!isRunning) return;
      // Mencegah belok balik 180 derajat langsung
      if (x !== 0 && velocity.x !== 0) return;
      if (y !== 0 && velocity.y !== 0) return;
      nextVelocity = { x, y };
    }

    function update() {
      velocity = { ...nextVelocity };
      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Tabrakan dengan Dinding
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Tabrakan dengan Tubuh Sendiri
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Memakan Makanan
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        currentScoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('cacing_highscore', highScore);
        }
        playBeep(600, 0.1, 'triangle');
        spawnFood();
      } else {
        snake.pop();
      }

      render();
    }

    function render() {
      // Background Kanvas
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gambar Garis Kisi Halus
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Gambar Makanan (Apel Merah Bersinar)
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#f87171';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
      const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
      ctx.arc(foodX, foodY, (GRID_SIZE / 2) - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Gambar Cacing
      snake.forEach((segment, index) => {
        const x = segment.x * GRID_SIZE;
        const y = segment.y * GRID_SIZE;
        const radius = 6;

        if (index === 0) {
          // Kepala Cacing
          ctx.fillStyle = '#4ade80';
          drawRoundedRect(ctx, x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2, radius);

          // Mata Cacing
          ctx.fillStyle = '#0f172a';
          const eyeSize = 3;
          let eye1 = { x: x + 6, y: y + 6 };
          let eye2 = { x: x + 14, y: y + 6 };
          if (velocity.y !== 0) {
            eye1 = { x: x + 5, y: y + 10 };
            eye2 = { x: x + 15, y: y + 10 };
          }
          ctx.beginPath();
          ctx.arc(eye1.x, eye1.y, eyeSize, 0, Math.PI * 2);
          ctx.arc(eye2.x, eye2.y, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Badan Cacing
          ctx.fillStyle = '#22c55e';
          drawRoundedRect(ctx, x + 2, y + 2, GRID_SIZE - 4, GRID_SIZE - 4, radius);
        }
      });
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
    }

    function startGame() {
      initGame();
      isRunning = true;
      overlay.classList.remove('active');
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(update, GAME_SPEED);
      playBeep(440, 0.1);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);
      playBeep(180, 0.35, 'sawtooth');
      overlayTitle.textContent = 'Game Over!';
      overlaySub.textContent = `Skor akhir kamu: ${score}`;
      startBtn.textContent = 'Main Lagi';
      overlay.classList.add('active');
    }

    // Event Listener Keyboard
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          setDirection(0, -1);
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          setDirection(0, 1);
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          setDirection(-1, 0);
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          setDirection(1, 0);
          break;
      }
    });

    // Event Tombol D-Pad Layar Sentuh
    document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));
    startBtn.addEventListener('click', startGame);

    // Gestur Swipe pada Kanvas
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) setDirection(1, 0);
        else if (diffX < -30) setDirection(-1, 0);
      } else {
        if (diffY > 30) setDirection(0, 1);
        else if (diffY < -30) setDirection(0, -1);
      }
    }, { passive: true });

    // Render awal
    initGame();
  </script>
</body>
</html>
